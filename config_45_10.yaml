# CLIPGCN tri-modal contrastive training config for 45 seen / 10 unseen classes.
# Relative paths are resolved from this config file's directory.

runtime:
  device: cuda:0
  seed: 20260616
  amp: true
  no_show: true

data:
  train:
    data_dir: ./data/contrastive_zsl_splits/45_10
    prefix: seen
    mmap: true

  val:
    data_dir: null
    prefix: seen
    mmap: true

  validation_split:
    fraction: 0.1
    seed: 20260616

  text:
    xlsx: ./ntu55_global_descriptions.xlsx
    id_column: ID
    text_column: global_description
    label_offset: 1
    prompt_template: "{global_description}"
    batch_size: 128
    cache_output: ./work_dir/clip_text_action_embeddings.pt

  dataloader:
    batch_size: 128
    num_workers: 16
    train_shuffle: true
    val_shuffle: false
    pin_memory: true
    drop_last: true

model:
  text_encoder:
    name: ViT-B/32
    download_root: null
  # The pre-VPOCLIP_plus checkpoints in this repo: attention reducer with two
  # layers, object map appended as a 14th frame, Kinect-25 skeletons.
  fusion:
    reducer: attention_pool
    dropout: 0.2
    attention_dim: 256
    attention_heads: 4
    attention_layers: 2
    object_fusion: temporal_concat
    video_channels: 25
    num_joints: 25

train:
  epochs: 240
  val_interval: 1
  grad_clip_norm: 1.0
  optimizer:
    name: AdamW
    lr: 0.0001
    weight_decay: 0.0001

outputs:
  work_dir: ./work_dir/clipgcn_contrastive_45_10
  auto_run_dir: true
  run_name: null
  best_model: ./work_dir/clipgcn_contrastive_45_10/best_model.pth
  last_model: ./work_dir/clipgcn_contrastive_45_10/last_model.pth
  history: ./work_dir/clipgcn_contrastive_45_10/history.json
  train_curve: ./work_dir/clipgcn_contrastive_45_10/train_curve.png
  test_results: ./work_dir/clipgcn_contrastive_45_10/unseen_test_results.json
